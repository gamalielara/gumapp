<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
<defs>
  <linearGradient id="mapG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2a3520"/><stop offset="50%" stop-color="#1e2818"/><stop offset="100%" stop-color="#1a2214"/>
  </linearGradient>
  <linearGradient id="mapFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a1c16" stop-opacity="0"/><stop offset="100%" stop-color="#1a1c16"/>
  </linearGradient>
</defs>

<rect width="375" height="812" fill="#1a1c16"/>

<!-- Map Area -->
<rect width="375" height="240" fill="url(#mapG)"/>
<!-- Grid lines -->
<line x1="0" y1="60" x2="375" y2="60" stroke="rgba(205,237,163,0.08)" stroke-width="1.5"/>
<line x1="0" y1="120" x2="375" y2="120" stroke="rgba(205,237,163,0.08)" stroke-width="1.5"/>
<line x1="0" y1="180" x2="375" y2="180" stroke="rgba(205,237,163,0.08)" stroke-width="1.5"/>
<line x1="100" y1="0" x2="100" y2="240" stroke="rgba(205,237,163,0.08)" stroke-width="1.5"/>
<line x1="200" y1="0" x2="200" y2="240" stroke="rgba(205,237,163,0.08)" stroke-width="1.5"/>
<line x1="300" y1="0" x2="300" y2="240" stroke="rgba(205,237,163,0.08)" stroke-width="1.5"/>
<!-- Route -->
<path d="M 50 190 Q 80 160, 120 130 Q 170 95, 210 85 Q 250 78, 280 60 Q 310 42, 340 50" fill="none" stroke="rgba(205,237,163,0.25)" stroke-width="6" stroke-linecap="round"/>
<path d="M 50 190 Q 80 160, 120 130 Q 170 95, 210 85 Q 250 78, 280 60 Q 310 42, 340 50" fill="none" stroke="#cdeda3" stroke-width="3" stroke-linecap="round"/>
<circle cx="50" cy="190" r="6" fill="#4c662b" stroke="#cdeda3" stroke-width="2"/>
<circle cx="340" cy="50" r="6" fill="#c44d56" stroke="#fff" stroke-width="2"/>
<!-- Fade -->
<rect y="180" width="375" height="60" fill="url(#mapFade)"/>

<!-- Back button -->
<circle cx="34" cy="30" r="18" fill="rgba(0,0,0,0.5)"/>
<text x="34" y="36" fill="#fff" font-size="16" text-anchor="middle">←</text>

<!-- Detail Card -->
<rect x="16" y="220" width="343" height="280" rx="20" fill="#232520" stroke="#333530" stroke-width="1"/>
<text x="34" y="248" fill="#6a6c62" font-size="12">Sunday, May 8, 2026 • 6:30 AM</text>
<text x="34" y="272" fill="#eaebe0" font-size="20" font-weight="700">Morning Run</text>

<!-- Main Stats (3-col) -->
<rect x="30" y="288" width="100" height="64" rx="14" fill="#2e312a"/>
<text x="80" y="318" fill="#cdeda3" font-size="22" font-weight="700" text-anchor="middle">5.2</text>
<text x="80" y="336" fill="#6a6c62" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.4">KM</text>

<rect x="138" y="288" width="100" height="64" rx="14" fill="#2e312a"/>
<text x="188" y="318" fill="#cdeda3" font-size="22" font-weight="700" text-anchor="middle">29:34</text>
<text x="188" y="336" fill="#6a6c62" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.4">DURATION</text>

<rect x="246" y="288" width="100" height="64" rx="14" fill="#2e312a"/>
<text x="296" y="318" fill="#cdeda3" font-size="22" font-weight="700" text-anchor="middle">5'41"</text>
<text x="296" y="336" fill="#6a6c62" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.4">PACE</text>

<!-- Secondary Stats -->
<rect x="30" y="364" width="100" height="50" rx="12" fill="none" stroke="#333530" stroke-width="1"/>
<text x="80" y="388" fill="#eaebe0" font-size="14" font-weight="600" text-anchor="middle">10.5</text>
<text x="80" y="404" fill="#6a6c62" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.3">AVG SPEED</text>

<rect x="138" y="364" width="100" height="50" rx="12" fill="none" stroke="#333530" stroke-width="1"/>
<text x="188" y="388" fill="#eaebe0" font-size="14" font-weight="600" text-anchor="middle">14.2</text>
<text x="188" y="404" fill="#6a6c62" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.3">MAX SPEED</text>

<rect x="246" y="364" width="100" height="50" rx="12" fill="none" stroke="#333530" stroke-width="1"/>
<text x="296" y="388" fill="#eaebe0" font-size="14" font-weight="600" text-anchor="middle">32 m</text>
<text x="296" y="404" fill="#6a6c62" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.3">ELEVATION</text>

<!-- Delete button -->
<rect x="30" y="430" width="316" height="40" rx="12" fill="none" stroke="rgba(196,77,86,0.25)" stroke-width="1"/>
<text x="187" y="455" fill="#c44d56" font-size="12" font-weight="600" text-anchor="middle">🗑  Delete run</text>
</svg>