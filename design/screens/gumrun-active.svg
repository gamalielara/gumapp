<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Google Sans, system-ui, sans-serif">
<defs>
  <linearGradient id="amG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#222a1a"/><stop offset="100%" stop-color="#181e12"/>
  </linearGradient>
</defs>

<rect width="375" height="812" fill="url(#amG)"/>

<!-- Grid background -->
<g opacity="0.04">
  <line x1="0" y1="40" x2="375" y2="40" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="80" x2="375" y2="80" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="120" x2="375" y2="120" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="160" x2="375" y2="160" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="200" x2="375" y2="200" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="240" x2="375" y2="240" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="280" x2="375" y2="280" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="320" x2="375" y2="320" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="360" x2="375" y2="360" stroke="#cdeda3" stroke-width="1"/>
  <line x1="0" y1="400" x2="375" y2="400" stroke="#cdeda3" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="500" stroke="#cdeda3" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="500" stroke="#cdeda3" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="500" stroke="#cdeda3" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="500" stroke="#cdeda3" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="500" stroke="#cdeda3" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="500" stroke="#cdeda3" stroke-width="1"/>
  <line x1="280" y1="0" x2="280" y2="500" stroke="#cdeda3" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="500" stroke="#cdeda3" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="500" stroke="#cdeda3" stroke-width="1"/>
</g>

<!-- Faint road shapes -->
<path d="M0,100 Q100,80 200,110 Q300,140 375,120" stroke="rgba(205,237,163,.08)" stroke-width="18" fill="none"/>
<path d="M0,250 Q80,230 180,260 Q280,290 375,260" stroke="rgba(205,237,163,.08)" stroke-width="18" fill="none"/>
<path d="M140,0 Q120,100 150,200 Q180,300 160,420" stroke="rgba(205,237,163,.08)" stroke-width="16" fill="none"/>

<!-- Run route path glow -->
<path d="M180,380 Q170,320 190,260 Q210,210 200,170 Q190,140 220,110 Q245,85 240,60" fill="none" stroke="rgba(53,78,22,.4)" stroke-width="5" stroke-linecap="round"/>
<!-- Run route path -->
<path d="M180,380 Q170,320 190,260 Q210,210 200,170 Q190,140 220,110 Q245,85 240,60" fill="none" stroke="#cdeda3" stroke-width="3" stroke-linecap="round"/>
<!-- Current position -->
<circle cx="240" cy="60" r="14" fill="rgba(76,102,43,0.2)">
  <animate attributeName="r" values="14;18;14" dur="1.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
</circle>
<circle cx="240" cy="60" r="7" fill="#4c662b" stroke="#cdeda3" stroke-width="2.5"/>

<!-- Top bar -->
<!-- Back button -->
<circle cx="35" cy="56" r="19" fill="rgba(0,0,0,0.45)"/>
<path d="M39,50 L33,56 L39,62" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Running pill -->
<rect x="138" y="40" width="100" height="32" rx="16" fill="rgba(0,0,0,0.55)"/>
<circle cx="156" cy="56" r="4" fill="#66cc66">
  <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
</circle>
<text x="168" y="61" fill="#fff" font-size="12" font-weight="700">Running</text>

<!-- Lock button -->
<circle cx="340" cy="56" r="19" fill="rgba(0,0,0,0.45)"/>
<rect x="333" y="50" width="14" height="10" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/>
<path d="M335,50 L335,47 Q335,42 340,42 Q345,42 345,47 L345,50" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

<!-- Bottom Panel -->
<rect x="0" y="480" width="375" height="332" rx="30" fill="rgba(30,33,26,0.92)"/>
<line x1="0" y1="481" x2="375" y2="481" stroke="#2e3128" stroke-width="1"/>

<!-- Handle -->
<rect x="168" y="490" width="40" height="4" rx="2" fill="#2e3128"/>

<!-- Elapsed time label -->
<text x="187" y="520" fill="#686a60" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">ELAPSED TIME</text>

<!-- Timer -->
<text x="187" y="578" fill="#f0f1e6" font-size="56" font-weight="900" text-anchor="middle" letter-spacing="-3">14:32</text>

<!-- Stats row -->
<line x1="30" y1="598" x2="345" y2="598" stroke="#2e3128" stroke-width="1"/>
<g text-anchor="middle">
  <text x="80" y="630" fill="#f0f1e6" font-size="24" font-weight="800" letter-spacing="-0.5">2.4</text>
  <text x="80" y="648" fill="#686a60" font-size="9" font-weight="700" letter-spacing="0.6">KM</text>
  <text x="187" y="630" fill="#f0f1e6" font-size="24" font-weight="800" letter-spacing="-0.5">6'03"</text>
  <text x="187" y="648" fill="#686a60" font-size="9" font-weight="700" letter-spacing="0.6">PACE</text>
  <text x="295" y="630" fill="#f0f1e6" font-size="24" font-weight="800" letter-spacing="-0.5">142</text>
  <text x="295" y="648" fill="#686a60" font-size="9" font-weight="700" letter-spacing="0.6">BPM</text>
</g>
<line x1="30" y1="662" x2="345" y2="662" stroke="#2e3128" stroke-width="1"/>

<!-- Controls -->
<!-- Stop button -->
<circle cx="112" cy="720" r="25" fill="rgba(224,96,112,0.1)" stroke="rgba(224,96,112,0.3)" stroke-width="1.5"/>
<rect x="103" y="711" width="18" height="18" rx="3" fill="#e06070"/>

<!-- Pause button (main) -->
<circle cx="187" cy="720" r="36" fill="#4c662b"/>
<rect x="176" y="706" width="6" height="28" rx="2" fill="#fff"/>
<rect x="188" y="706" width="6" height="28" rx="2" fill="#fff"/>

<!-- Lock button -->
<circle cx="262" cy="720" r="25" fill="rgba(76,102,43,0.08)" stroke="rgba(76,102,43,0.25)" stroke-width="1.5"/>
<rect x="255" y="714" width="14" height="10" rx="2" fill="none" stroke="#cdeda3" stroke-width="1.5"/>
<path d="M257,714 L257,711 Q257,706 262,706 Q267,706 267,711 L267,714" fill="none" stroke="#cdeda3" stroke-width="1.5" stroke-linecap="round"/>
</svg>