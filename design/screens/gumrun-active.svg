<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
<defs>
  <linearGradient id="amG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2a3520"/><stop offset="100%" stop-color="#1e2818"/>
  </linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(35,37,32,0.94)"/><stop offset="100%" stop-color="#232520"/>
  </linearGradient>
</defs>

<!-- Full screen map bg -->
<rect width="375" height="812" fill="url(#amG)"/>

<!-- Grid pattern -->
<g stroke="rgba(205,237,163,0.04)" stroke-width="1">
  <line x1="0" y1="40" x2="375" y2="40"/><line x1="0" y1="80" x2="375" y2="80"/>
  <line x1="0" y1="120" x2="375" y2="120"/><line x1="0" y1="160" x2="375" y2="160"/>
  <line x1="0" y1="200" x2="375" y2="200"/><line x1="0" y1="240" x2="375" y2="240"/>
  <line x1="0" y1="280" x2="375" y2="280"/><line x1="0" y1="320" x2="375" y2="320"/>
  <line x1="0" y1="360" x2="375" y2="360"/><line x1="0" y1="400" x2="375" y2="400"/>
  <line x1="0" y1="440" x2="375" y2="440"/>
  <line x1="40" y1="0" x2="40" y2="500"/><line x1="80" y1="0" x2="80" y2="500"/>
  <line x1="120" y1="0" x2="120" y2="500"/><line x1="160" y1="0" x2="160" y2="500"/>
  <line x1="200" y1="0" x2="200" y2="500"/><line x1="240" y1="0" x2="240" y2="500"/>
  <line x1="280" y1="0" x2="280" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
  <line x1="360" y1="0" x2="360" y2="500"/>
</g>

<!-- Road shapes -->
<path d="M 0 100 Q 100 80, 200 110 Q 300 140, 375 120" stroke="rgba(205,237,163,0.08)" stroke-width="16" fill="none"/>
<path d="M 0 250 Q 80 230, 180 260 Q 280 290, 375 260" stroke="rgba(205,237,163,0.08)" stroke-width="16" fill="none"/>
<path d="M 140 0 Q 120 100, 150 200 Q 180 300, 160 420" stroke="rgba(205,237,163,0.08)" stroke-width="14" fill="none"/>

<!-- Route path -->
<path d="M 180 380 Q 170 320, 190 260 Q 210 210, 200 170 Q 190 140, 220 110 Q 245 85, 240 60" fill="none" stroke="rgba(53,78,22,0.5)" stroke-width="4.5" stroke-linecap="round"/>
<path d="M 180 380 Q 170 320, 190 260 Q 210 210, 200 170 Q 190 140, 220 110 Q 245 85, 240 60" fill="none" stroke="#cdeda3" stroke-width="3" stroke-linecap="round"/>

<!-- Current location -->
<circle cx="240" cy="60" r="14" fill="rgba(76,102,43,0.2)"/>
<circle cx="240" cy="60" r="9" fill="rgba(76,102,43,0.35)"/>
<circle cx="240" cy="60" r="6" fill="#4c662b" stroke="#cdeda3" stroke-width="2.5"/>

<!-- Top bar -->
<!-- Back button -->
<circle cx="34" cy="40" r="18" fill="rgba(0,0,0,0.5)"/>
<text x="34" y="46" fill="#fff" font-size="16" text-anchor="middle">←</text>

<!-- Running pill -->
<rect x="145" y="24" width="85" height="32" rx="50" fill="rgba(0,0,0,0.6)"/>
<circle cx="162" cy="40" r="4" fill="#4caf50"/>
<text x="194" y="45" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Running</text>

<!-- Lock button -->
<circle cx="341" cy="40" r="18" fill="rgba(0,0,0,0.5)"/>
<text x="341" y="46" fill="#fff" font-size="14" text-anchor="middle">🔓</text>

<!-- Bottom Panel -->
<rect x="0" y="520" width="375" height="292" rx="28" fill="rgba(35,37,32,0.94)"/>
<line x1="0" y1="520" x2="375" y2="520" stroke="#333530" stroke-width="1"/>

<!-- Handle -->
<rect x="170" y="530" width="36" height="4" rx="2" fill="#333530"/>

<!-- Timer label -->
<text x="187" y="556" fill="#6a6c62" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">ELAPSED TIME</text>

<!-- Timer -->
<text x="187" y="610" fill="#eaebe0" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="-3">14:32</text>

<!-- Stats row -->
<line x1="24" y1="630" x2="351" y2="630" stroke="#333530" stroke-width="1"/>
<g text-anchor="middle">
  <text x="80" y="660" fill="#eaebe0" font-size="22" font-weight="700">2.4</text>
  <text x="80" y="676" fill="#6a6c62" font-size="9" font-weight="600" letter-spacing="0.6">KM</text>

  <text x="187" y="660" fill="#eaebe0" font-size="22" font-weight="700">6'03"</text>
  <text x="187" y="676" fill="#6a6c62" font-size="9" font-weight="600" letter-spacing="0.6">PACE</text>

  <text x="295" y="660" fill="#eaebe0" font-size="22" font-weight="700">142</text>
  <text x="295" y="676" fill="#6a6c62" font-size="9" font-weight="600" letter-spacing="0.6">BPM</text>
</g>
<line x1="24" y1="690" x2="351" y2="690" stroke="#333530" stroke-width="1"/>

<!-- Controls -->
<!-- Stop -->
<circle cx="110" cy="738" r="24" fill="rgba(196,77,86,0.12)" stroke="rgba(196,77,86,0.3)" stroke-width="1.5"/>
<rect x="103" y="731" width="14" height="14" rx="2" fill="#c44d56"/>

<!-- Pause (main) -->
<circle cx="187" cy="738" r="34" fill="#4c662b"/>
<rect x="176" y="726" width="6" height="24" rx="2" fill="#fff"/>
<rect x="188" y="726" width="6" height="24" rx="2" fill="#fff"/>

<!-- Lock -->
<circle cx="264" cy="738" r="24" fill="rgba(76,102,43,0.1)" stroke="rgba(76,102,43,0.25)" stroke-width="1.5"/>
<text x="264" y="744" fill="#cdeda3" font-size="18" text-anchor="middle">🔒</text>
</svg>